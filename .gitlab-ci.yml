variables:
  HELM_RELEASE_NAME: permalink
  HELM_NAMESPACE: pt-permalink

stages:
  - build
  - deploy

.image-build-template: &image-build
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - eval docker build $IMGARGS --pull -t "$CI_REGISTRY_IMAGE/$IMGNAME:$CI_COMMIT_REF_SLUG" app/$IMGNAME
    - docker push "$CI_REGISTRY_IMAGE/$IMGNAME:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_PIPELINE_SOURCE != 'merge_request_event'
      changes:
        - app/$IMGNAME/**/*

build:nginx:
  <<: *image-build
  variables:
    IMGNAME: nginx
  rules:
    - if: $CI_PIPELINE_SOURCE != 'merge_request_event'
      changes:
        - app/nginx/**/*

build:permalink:
  <<: *image-build
  variables:
    IMGNAME: permalink
  rules:
    - if: $CI_PIPELINE_SOURCE != 'merge_request_event'
      changes:
        - app/permalink/**/*

deploy:
  stage: deploy
  image: $CI_REGISTRY/pole-techno/docker-images/okd-cicd-client:latest
  script:
    - oc config use-context pole-techno/okd-agents:okd-$CI_COMMIT_REF_SLUG
    - oc whoami
    - oc project $HELM_NAMESPACE
    - cd helm
    - helm dependency update
    # Extract existing secret values
    - export NEXTCLOUD_CLIENT_ID=$(oc get secret permalink-web-secret -o jsonpath='{.data.NEXTCLOUD_CLIENT_ID}' | base64 -d)
    - export NEXTCLOUD_SECRET_ID=$(oc get secret permalink-web-secret -o jsonpath='{.data.NEXTCLOUD_SECRET_ID}' | base64 -d)
    - export NEXTCLOUD_ADMIN_USER=$(oc get secret permalink-web-secret -o jsonpath='{.data.NEXTCLOUD_ADMIN_USER}' | base64 -d)
    - export NEXTCLOUD_ADMIN_PASSWORD=$(oc get secret permalink-web-secret -o jsonpath='{.data.NEXTCLOUD_ADMIN_PASSWORD}' | base64 -d)
    - export OIDC_CLIENT_ID=$(oc get secret permalink-web-secret -o jsonpath='{.data.OIDC_CLIENT_ID}' | base64 -d)
    - export OIDC_SECRET_ID=$(oc get secret permalink-web-secret -o jsonpath='{.data.OIDC_SECRET_ID}' | base64 -d)
    - export SECRET_KEY=$(oc get secret permalink-web-secret -o jsonpath='{.data.SECRET_KEY}' | base64 -d)
    # Helm upgrade WITHOUT overriding the secret
    - |
      helm upgrade --install "$HELM_RELEASE_NAME" . \
        -f values-$CI_COMMIT_REF_SLUG.yaml \
        --set web.NEXTCLOUD_CLIENT_ID="$NEXTCLOUD_CLIENT_ID" \
        --set web.NEXTCLOUD_SECRET_ID="$NEXTCLOUD_SECRET_ID" \
        --set web.NEXTCLOUD_ADMIN_USER="$NEXTCLOUD_ADMIN_USER" \
        --set web.NEXTCLOUD_ADMIN_PASSWORD="$NEXTCLOUD_ADMIN_PASSWORD" \
        --set oidc.OIDC_CLIENT_ID="$OIDC_CLIENT_ID" \
        --set oidc.OIDC_SECRET_ID="$OIDC_SECRET_ID" \
        --set web.SECRET_KEY="$SECRET_KEY"
    - oc rollout restart deployment django-permalink
  only:
    refs:
      - dev
      - prd
