{% extends 'base.html' %}
{% load static %}

{% block additional_button %}

<button data-modal-target="modalMain" data-modal-toggle="modalMain" class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    hx-get="/link/create-link/"
    hx-trigger="click"
    hx-target="#modal-content">
    <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
    Create
</button>

{% endblock %}

{% block pagecontent %}


<div>
    <table id="links" border="1" >
        <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>
                    <span class="flex items-center">
                        Permalink
                    </span>
                </th>
                <th>
                    <span class="flex items-center">
                        Target URL
                    </span>
                </th>
                <th>
                    <span class="flex items-center">
                        Updated At
                    </span>
                </th>
            </tr>
        </thead>
        <tbody>
            {% for link in links %}
                {% include "link_row.html" with link=link %}
            {% empty %}
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% include "scripts/datatable.js.html" %}

{% endblock %}
