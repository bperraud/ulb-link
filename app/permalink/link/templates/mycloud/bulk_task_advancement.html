<style>
@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.4); opacity: 0.5; }
}
</style>

<div style="display: flex; align-items: center; gap: 8px; color: #fff; margin-bottom: 0.5rem;">
  <span id="label-text"></span>
  <span id="spinner" style="
    width: 8px; height: 8px;
    border-radius: 50%;
    background: white;
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  "></span>
</div>
<div style="background: #eee; border-radius: 999px; height: 12px; overflow: hidden; width: 30%; margin-bottom: 1rem;">
  <div id="bar" style="height: 100%; width: 0%; background: #1D9E75;"</div>
</div>


<script>
var total   = parseInt("{{ initial_file_count }}");
var current = total - parseInt("{{ file_count_left }}");
var pct     = Math.min(100, Math.round(current / total * 100));

document.getElementById('bar').style.width = pct + '%';
document.getElementById('label-text').textContent = current + ' of ' + total + ' permalinks created';
document.getElementById('spinner').style.display = 'inline-block';

</script>
