<tr id="link-{{ link.id }}">
    <td><input type="checkbox" class="w-4 h-4 border border-default-medium rounded-xs bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft" value="{{ link.id }}" name="input-checkbox"></td>
    <td class="font-medium text-heading whitespace-nowrap"><a href="{{ HOST }}/t/{{ link.token }}">{{ HOST }}/t/{{ link.token }}</a> <button onclick="copyToClipboard()" style="float: right;" class="mr-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 ml-1 inline">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
        </svg>
</button> </td>
    <td><a href="{{ link.direct_target_url }}">{{ link.direct_target_url }}</a></td>
    <td>{{ link.updated_at }}</td>
</tr>


<script>
function copyToClipboard() {
  navigator.clipboard.writeText("{{ HOST }}/{{ link.token }}").then(() => {
    showAlert("permalink copied to clipboard");
  });
}
</script>
