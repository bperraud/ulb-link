{% load static %}


<div>

  <form 
    method="POST"
    id="createBulkForm"
    hx-post="{% url 'create-nextcloud-bulk' %}"
    class="p-4 md:p-5"
  >
    {% csrf_token %}

    <div class="px-4 overflow-y-auto" id="main-div">
    <div id="jstree"></div>

        <div class="flex items-center gap-2 mb-2">
          <button
            type="submit"
            id="submitButton"
            disabled
            class="bg-blue-600 text-white font-bold py-2 px-4 rounded"
          >
            Submit
          </button>
        </div>
    </div>

  </form>

</div>


<script>

$(function () {
  $('#jstree').jstree({
    core: {
        data: {{ data|safe }}
    },
    plugins: ['checkbox']
  }).on('ready.jstree', function () {
      // Open all first-level nodes under the root
      $('#jstree').jstree('open_all');
    });

  $('#jstree').on("changed.jstree", function (e, data) {
    document.getElementById('submitButton').disabled = data.selected.length === 0;
  });

$('#createBulkForm').on('submit', function () {

    const selected = $('#jstree').jstree(true).get_checked();

    $('<input>')
        .attr('type', 'hidden')
        .attr('name', 'selected_nodes')
        .val(JSON.stringify(selected))
        .appendTo(this);
});

});

  if (document.getElementById('modalTitle')) {
    modalTitle.textContent = "{{ modal_title|escapejs }}";
  }


</script>


<style>
  button:disabled {
    background-color: #9ca3af;
    color: #e5e7eb;
    cursor: not-allowed;
    opacity: 0.7;
  }

  #main-div {
      max-height: 500px;
  }

</style>
