  
<div>
    <form 
        class="p-4 md:p-5"
        method="POST" 
        id="saveForm" 
        hx-post="{% url 'create-link' %}" 
        hx-target="#modal-content"
        hx-swap="innerHTML"
      >
        {% csrf_token %}
        {% include "form_snippet.html" %}
    </form>
    <div class="flex justify-center p-4">
        <button
          type="submit"
          form="saveForm"
          id="submitButton"
          class="btn-primary"
        >
          Add new permalink
        </button>
    </div>
</div>

<script>
    document.getElementById('modalTitle').textContent = 'Edit link';
</script>

{% block scripts %}
<script>
    document.getElementById('submitButton').addEventListener('click', function() {
        htmx.trigger(document.getElementById('saveForm'), 'submit');
    });
    if (document.getElementById('modalTitle')) {
      modalTitle.textContent = "{{ modal_title|escapejs }}";
    }
</script>
{% endblock %}
