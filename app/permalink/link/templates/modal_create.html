<div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700"  id="modalContainer">
    <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
            Create permalink
        </h3>
        <button id="closeModalButton" type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="modals-here">
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
            <span class="sr-only">Close modal</span>
        </button>
    </div>
      <form 
        class="p-4 md:p-5"
        method="POST" 
        id="saveForm" 
        hx-post="{% url 'create-link' %}" 
        hx-target="#modalContainer" 
        hx-swap="outerHTML"
      >
        {% csrf_token %}
        {% include "form_snippet.html" %}
      </form>
        <div class="flex justify-center p-4">
            <button
              type="submit"
              form="saveForm"
              id="submitButton"
              class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
            >
              Add new permalink
            </button>
      </div>
    
</div>


<script>
    document.getElementById('submitButton').addEventListener('click', function() {
        htmx.trigger(document.getElementById('saveForm'), 'submit');
    });
