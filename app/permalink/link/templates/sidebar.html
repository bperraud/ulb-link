
<!-- Sidebar -->
<div class="fixed top-[56px] bottom-0 left-0 w-56 border-r border-gray-300 bg-gray-50 p-4 overflow-y-auto">
  <ul class="flex flex-col space-y-2">
    <li>
      {% block additional_button %}
      {% endblock %}
    </li>

    <li class="{% if request.resolver_match.url_name == 'link-home' %}bg-gray-200 font-semibold{% endif %} rounded flex items-center space-x-2 px-2 py-1 hover:bg-gray-100 transition">
      <img src="{% static 'link.svg' %}" alt="link" class="w-4 h-4" />
      <a href="{% url 'link-home' %}" class="text-gray-700 hover:text-gray-900">Links</a>
    </li>

    {% if user.is_nextcloud_user %}
    <li class="{% if request.resolver_match.url_name == 'mycloud-link' %}bg-gray-200 font-semibold{% endif %} rounded flex items-center space-x-2 px-2 py-1 hover:bg-gray-100 transition">
      <img src="{% static 'nextcloud.jpg' %}" width="18" height="18" alt="users" />
      <a href="{% url 'mycloud-link' %}" class="text-gray-700 hover:text-gray-900">Mycloud</a>
    </li>
    {% endif %}
  </ul>
</div>
