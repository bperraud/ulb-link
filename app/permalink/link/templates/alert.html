<div id="greenAlert" class="fixed hidden top-5 right-5 z-[1100] flex sm:items-center p-4 mb-4 text-sm  border border-green-700 rounded-lg bg-success-soft dark:bg-gray-800 text-green-500"
     role="alert">

    <svg class="shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
    </svg>
    <span class="sr-only">Info</span>

    <div>
        <span class="font-medium" id="infoMessage">Info alert!</span>
    </div>

</div>


<div id="redAlert" class="fixed hidden top-5 right-5 z-[1100] flex sm:items-center p-4 mb-4 text-sm  border border-red-700 rounded-lg bg-success-soft dark:bg-gray-800 text-red-500"
     role="alert">

    <svg class="shrink-0 inline w-4 h-4 me-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
    </svg>
    <span class="sr-only">Info</span>

    <div>
        <span class="font-medium" id="alertMessage">Error alert!</span>
    </div>

</div>

<script>

function showAlert(message, type = "success", timeout = 300000) {
    let alert;
    let innerSpan;
    if (type == "success") {
        alert = document.getElementById("greenAlert");
        innerSpan = document.getElementById("infoMessage");
    }
    else {
        alert = document.getElementById("redAlert");
        innerSpan = document.getElementById("alertMessage");
    }
    innerSpan.textContent = message;
    alert.style.display = "flex";
    setTimeout(() => alert.classList.add("show"), 10);

    if (timeout) {
        setTimeout(() => {
          alert.classList.remove("show");
          setTimeout(() => (alert.style.display = "none"), 150);
        }, timeout);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const msg = sessionStorage.getItem("flashMessage");
    let type = sessionStorage.getItem("type");

    if (type == undefined) {
        type = "success";
    }
    if (msg) {
        showAlert(msg, type);
        sessionStorage.removeItem("flashMessage");
        sessionStorage.removeItem("type");
    }
});

document.body.addEventListener("flashMessage", function (event) {
    sessionStorage.setItem("flashMessage", event.detail.value);
});

document.body.addEventListener("type", function (event) {
    sessionStorage.setItem("type", event.detail.value);
});

</script>
