<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
    {% block mail_title %}
    {% endblock %}
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6; padding:40px 0;">
    <tr>
      <td align="center">

        <!-- Main container -->
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; padding:30px; text-align:center;">
          
          <tr>
            <td style="padding:20px 16px;">
                <img src="{{ site_domain }}/static/ULB.png" width="50" alt="Logo" />
            </td>
          </tr>

          <!-- Greeting -->
          <tr>
            <td style="font-size:18px; color:#111827; padding-bottom:20px;">
              Bonjour {{ user.username }},
            </td>
          </tr>

            {% block mail_content %}
            {% endblock %}

          <!-- Footer -->
          <tr>
            <td style="border-top:1px solid #e5e7eb; padding-top:20px; font-size:11px; color:#9ca3af;">
              <p style="margin:0 0 5px 0;">
                Permalink - A ULB service
              </p>
              <p style="margin:0;">
                Ceci est un e-mail envoyé automatiquement, veuillez ne pas y répondre.
              </p>
              <p style="margin:0;">
                Si vous ne souhaitez plus recevoir d'emails cliquez : 
                <a href="{{ site_domain }}/unsubscribe/{{ token }}" style="text-decoration:none;">
                    <span style="margin:0; font-size:10px; color:#1f2937; font-weight:bold;">
                      ICI
                    </span>
                </a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
