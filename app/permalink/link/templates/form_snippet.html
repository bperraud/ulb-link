{% for field in form %}
  <div class="form-group">

    <label for="{{ field.id_for_label }}" class="dark:text-white block text-gray-700 font-medium mb-1">
      {{ field.label }}
    </label>

    {{ field }}

    <label for="{{ field.id_for_errors }}" class="dark:text-white block text-red-700 font-medium mb-1">
        {{ field.errors }}
    </label>
  </div>
{% endfor %}
