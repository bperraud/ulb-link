<script>

$(document).ready(function () {
    const dataTable = new simpleDatatables.DataTable("#links", {
        searchable: true,
        sortable: true,
        perPage: 50,
        perPageSelect: [10, 25, 50, 100],
        columns: [
            { select: [0], sortable: false }, // disable sorting for checkbox column
          ],
    });

    setTimeout(() => {
        const topSection = document.querySelector(".datatable-top");
        topSection.classList.add('items-center');
        if (topSection) {
            const editContainer = document.createElement("div");
            editContainer.id = "edit-container";
            editContainer.setAttribute("hx-swap", "innerHTML");
            editContainer.className = "mr-auto"

            if (topSection.children.length >= 1) {
                topSection.insertBefore(editContainer, topSection.children[1]);
            }
        }
    }, 50);
});

document.getElementById('selectAll').addEventListener('change', function () {
    const checkboxes = document.querySelectorAll('input[name="input-checkbox"]');
    checkboxes.forEach(cb => cb.checked = this.checked);
});


function getSelectedIds() {
    return [...document.querySelectorAll('input[name="input-checkbox"]:checked')].map(cb => cb.value);
}

function getSelectedIdsLen() {
    if (selectAll.checked) {
        return 'all';
    }
    else {
        return getSelectedIds().length;
    }
}

document.querySelector('#links').addEventListener('change', (event) => {
    if (!event.target.matches('input[type="checkbox"]')) return;

    const url = `/link/toolbar/${getSelectedIds().length}`;
    htmx.ajax('GET', url, '#edit-container');
});


document.body.addEventListener('click', function (event) {
    const renewButton = event.target.closest('#renew-expiration-button');
    if (!renewButton) return;

    event.preventDefault();

    const ids = getSelectedIds();
    const url = `/mycloud/renew-expiration/${ids}`;
    htmx.ajax('GET', url);
});



document.body.addEventListener('click', function (event) {
    const editButton = event.target.closest('#edit-button');
    if (!editButton) return;

    event.preventDefault();

    const ids = getSelectedIds();
    const url = `/link/edit/${ids[0]}`;
    htmx.ajax('GET', url, '#modal-content');
});

document.body.addEventListener('click', function (event) {
    const deleteButton = event.target.closest('#delete-button');
    if (!deleteButton) return;

    event.preventDefault();
    const selectAll = document.querySelector('#selectAll');
    const ids = getSelectedIds();

    const url = selectAll.checked
        ? '/link/delete_all/'
        : `/link/delete/${ids}`;

    fetch(url, {
        method: 'DELETE',
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
        }
    })
    .then(res => {
        if (!res.ok) return;
        showAlert(ids.length > 1 ? "Links deleted" : "Link deleted");

        ids.forEach(id => {
            const row = document.querySelector(`#link-${id}`);
            if (row) row.remove();
        });

        document.getElementById('edit-container').innerHTML = '';
    });
});

</script>


<style>

.datatable-wrapper .datatable-container {
  border: 1px solid #374151;
  border-radius: .5rem;
  overflow-x: auto;
}

</style>
