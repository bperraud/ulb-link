services:
  db:
    container_name: postgresdb
    image: postgres:17.5
    restart: always
    env_file:
      - ./env_configs/db_conn.env
    volumes:
      - postgredata:/var/lib/postgresql/data
    expose:
      - 5432

  django:
    container_name: django-permalink
    build:
      context: ./permalink
      # target: prd
      target: dev
    env_file:
      - ./env_configs/db_conn.env
      - ./env_configs/env_dev.env
    volumes:
      - ./permalink/:/app/
    #   - mediaroot:/app/media_root
      - static_root:/app/static_root
      - pylab_logs:/var/log/
    expose:
      - 8000
    extra_hosts:
      - nextcloud.local:host-gateway
    depends_on:
      - db

  celery:
    container_name: celery-permalink
    command: celery -A permalink worker --loglevel=info
    build:
      context: ./permalink
      # target: prd
      target: dev
    env_file:
      - ./env_configs/db_conn.env
      - ./env_configs/env_dev.env
    volumes:
      - ./permalink/:/app/
    extra_hosts:
      - nextcloud.local:host-gateway
    depends_on:
      - db

  redis:
    container_name: redis-permalink
    image: redis
    restart: always
    expose:
      - 6379


  nginx-permalink:
    container_name: nginx
    build:
      context: ./nginx
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      SITE_DOMAIN: localhost
      NGINX_PORT: "8080"
      NEXTCLOUD_URL: nc-test.ulb.ac.be
      NGINX_SCHEME: http
    restart: always
    ports:
      - "8080:8080"
      # - "8080:8080"
      # - "443:443"
    volumes:
    #   - mediaroot:/app/media_root
      - static_root:/app/static_root
    depends_on:
      - django

volumes:
  postgredata:
  static_root:
  pylab_logs:
