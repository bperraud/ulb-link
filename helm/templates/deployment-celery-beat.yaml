apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: beat
          image: {{ .Values.web.image }}
          resources:
            limits:
              memory: "512Mi"
          command:
            [
              "celery",
              "-A",
              "permalink",
              "beat",
              "-l",
              "info",
              "--scheduler",
              "django_celery_beat.schedulers:DatabaseScheduler"
            ]
          envFrom:
            - secretRef:
                name: permalink-web-secret
            - configMapRef:
                name: web-config
            - configMapRef:
                name: db-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: postgres-password
