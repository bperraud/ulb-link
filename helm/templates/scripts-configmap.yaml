---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permalink-scripts
data: 
  backup_db.sh: |+
    #!/bin/bash

    set -e
    set -o pipefail

    keep=10

    backupdir="/var/backups"
    lockfile="$backupdir/.lock"

    if [ -z "$1" ]; then
      backup_file="backup-`date +%d-%m-%+4Y_%H:%M`.sql.gz"
    else
      backup_file="$1"
    fi

    mkdir -p "$backupdir"
    cd "$backupdir"

    if [ -e "$lockfile" ]; then
      echo "Backup lock file exists; not backup up"
      exit 1
    fi

    trap "rm -f $lockfile" exit
    touch "$lockfile"
    sleep 2

    echo "Backing up database from posgres primary..."
    if ! pg_dump -h "$DATABASE_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$backup_file"; then
      rm -f $backup_file
      echo "Backup failed!"
      exit 1
    fi

    ls -la

    echo "Pruning old backups"
    ls -tr | head -n -$keep | xargs rm -f

  restore_db.sh: |+
    #!/bin/bash

    set -e
    set -o pipefail

    if [ -z "$1" ]; then
      echo "Usage: $0 <backup-file.sql.gz>"
      exit 1
    fi

    backup_file="$1"

    if [ ! -f "$backup_file" ]; then
      echo "Backup file '$backup_file' does not exist in $backupdir"
      exit 1
    fi

    echo "Restoring database '$POSTGRES_DB' from $backup_file..."

    # Drop the database first
    psql -h "$DATABASE_HOST" -U "$POSTGRES_USER" -d postgres -c "DROP DATABASE IF EXISTS $POSTGRES_DB;"
    psql -h "$DATABASE_HOST" -U "$POSTGRES_USER" -d postgres  -c "CREATE DATABASE $POSTGRES_DB;"

    # Decompress and restore
    if gunzip -c "$backup_file" | psql -h "$DATABASE_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
      echo "Database restored successfully!"
    else
      echo "Restore failed!"
      exit 1
    fi

