apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: beat
          image: {{ .Values.web.image }}
          command:
            [
              "celery",
              "-A",
              "permalink",
              "beat",
              "-l",
              "info",
              "--scheduler",
              "django_celery_beat.schedulers:DatabaseScheduler"
            ]
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
