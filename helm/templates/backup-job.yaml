apiVersion: batch/v1
kind: CronJob
metadata:
  name: permalink-db-backup
spec:
  schedule: '27 23 * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: postgres-backup-pvc
              persistentVolumeClaim:
                claimName: permalink-backup
            - name: nextcloud-scripts
              configMap:
                name: nextcloud-scripts
                defaultMode: 0777
          containers:
            envFrom:
              - configMapRef:
                name: db-config
            env:
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    name: postgres-creds
                    key: postgres-user
              - name: PGPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: postgres-creds
                    key: postgres-password
            image: postgres:17.5
            name: permalink-db-backup
            command:
                - /scripts/backup_db.sh
            volumeMounts:
                - name: permalink-backup
                  mountPath: /var/backups
                - name: nextcloud-scripts
                  mountPath: /scripts
