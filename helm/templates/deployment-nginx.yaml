apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      volumes:
        - name: permalink-static
          persistentVolumeClaim:
            claimName: permalink-static
      containers:
      - name: nginx
        resources:
          limits:
            memory: "128Mi"
        image: {{ .Values.helm.nginx.image }}
        imagePullPolicy: Always
        env:
        - name: NGINX_PORT
          value: "8080"
        - name: SITE_DOMAIN
          value: {{ .Values.web.SITE_DOMAIN }}
        - name: NEXTCLOUD_URL
          value: {{ .Values.web.NEXTCLOUD_URL }}
        - name: NGINX_ENVSUBST_OUTPUT_DIR
          value: /etc/nginx/conf.d
        - name: NGINX_SCHEME
          value: https
        ports:
        - containerPort: 8080
        - containerPort: 443
        volumeMounts:
        - name: permalink-static
          mountPath: /app/static_root
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: https
    port: 443
    targetPort: 443
  selector:
    app: nginx
