apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-permalink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-permalink
  template:
    metadata:
      labels:
        app: django-permalink
    spec:
      volumes:
        - name: permalink-static
          persistentVolumeClaim:
            claimName: permalink-static

      initContainers:
        - name: wait-for-postgres
          resources:
             limits:
               memory: "128Mi"
          image: "{{ .Values.helm.postgres.image }}"
          env:
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DATABASE_HOST
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: postgres-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: postgres-password
          command: ['sh', '-c', 'until psql -h $PG_HOST -U $PG_USER -d postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 1; done;']

      containers:
      - name: django-permalink
        resources:
          limits:
            memory: "2Gi"
        image: {{ .Values.web.image }}
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: permalink-web-secret
          - configMapRef:
              name: web-config
          - configMapRef:
              name: db-config
        env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: postgres-password
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: permalink-static
          mountPath: /app/static_root
        {{/* - name: pylab-logs */}}
        {{/*   mountPath: /var/log/pylab */}}

---
apiVersion: v1
kind: Service
metadata:
  name: django-permalink
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: django-permalink
